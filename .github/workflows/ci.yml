name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# onnxruntime-node (used only by the local Whisper/TTS eval scripts) tries to download CUDA
# binaries on Linux during install; CI never needs them, and that download can 404.
env:
  npm_config_onnxruntime_node_install_cuda: skip
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run evals

  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx -y firebase-tools@latest emulators:exec --only firestore --project demo-secondlook "npm run test:rules -w web"
